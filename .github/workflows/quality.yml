name: Production quality gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-build.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      APP_ENV: test
      APP_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.112.0 }
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - run: supabase db reset --local
      - run: supabase db lint --local --level warning
      - run: supabase test db --local supabase/tests
      - run: pnpm exec playwright install --with-deps chromium
      - name: Authenticated browser and accessibility gate
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          export SUPABASE_SECRET_KEY="${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          export NEXT_PUBLIC_APP_URL="http://localhost:3100"
          export WEBHOOK_ENCRYPTION_KEY="ci-only-webhook-encryption-key-32-bytes"
          export CRON_SECRET="ci-only-cron-secret"
          export RATE_LIMIT_SECRET="ci-only-rate-limit-secret"
          export APP_ENV="test"
          export APP_RELEASE="${{ github.sha }}"
          export E2E_AUTH="1"
          pnpm build
          pnpm test:e2e
